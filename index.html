        function renderChannelsTable() {
            const data = dashboardData[currentPeriod];
            const channels = data.channels || [];

            // Функция для создания прогресс-бара
            function progressBar(fact, plan, isCurrency = false, isInverse = false) {
                if (plan === 0 && fact === 0) return '<span class="channel-empty">—</span>';

                const pct = plan > 0 ? Math.round((fact / plan) * 100) : (fact > 0 ? 100 : 0);
                const displayPct = Math.min(pct, 100);

                // Для бюджета: меньше плана = хорошо (isInverse)
                // Для лидов: больше плана = хорошо
                let barClass = 'neutral';
                if (isInverse) {
                    barClass = pct <= 100 ? 'success' : pct <= 120 ? 'warning' : 'danger';
                } else {
                    barClass = pct >= 100 ? 'success' : pct >= 70 ? 'warning' : 'danger';
                }

                const displayValue = isCurrency ? formatCurrency(fact) : fact;

                return `
                    <div class="channel-progress">
                        <div class="channel-progress-header">
                            <span class="channel-progress-value">${displayValue}</span>
                            <span class="channel-progress-pct ${barClass}">${pct}%</span>
                        </div>
                        <div class="channel-progress-bar">
                            <div class="channel-progress-fill ${barClass}" style="width: ${displayPct}%"></div>
                        </div>
                    </div>
                `;
            }

            // Функция расчета конверсии
            function calcConversion(from, to) {
                if (from === 0 || to === 0) return null;
                return Math.round((to / from) * 100);
            }

            // Функция для отображения значения конверсии с классом
            function conversionDisplay(value) {
                if (value === null || value === undefined) return '<span class="channel-detail-value">—</span>';
                // Нормализуем значение если оно уже в процентах (меньше 1)
                let displayValue = value;
                if (value > 0 && value < 1) {
                    displayValue = Math.round(value * 100);
                }
                let cls = 'channel-detail-value';
                // Для конверсий >100% (перенос с прошлого периода и т.п.) показываем нейтрально
                if (displayValue > 100) cls += ' positive';
                else if (displayValue >= 30) cls += ' positive';
                else if (displayValue >= 15) cls += ' warning';
                else cls += ' negative';
                return `<span class="${cls}">${displayValue}%</span>`;
            }

            const container = document.getElementById('channelsTable');
            container.innerHTML = `
                <thead>
                    <tr>
                        <th>Канал</th>
                        <th>Бюджет</th>
                        <th>Лиды</th>
                        <th>Демо назн.</th>
                        <th>Демо пров.</th>
                        <th>Оплаты</th>
                        <th>CPL</th>
                    </tr>
                </thead>
                <tbody>
                    ${channels.map((ch, idx) => {
                        const budgetPlan = ch.budgetPlan ?? 0;
                        const budgetFact = ch.budgetFact ?? ch.budget ?? 0;
                        const leadsPlan = ch.leadsPlan ?? 0;
                        const leadsFact = ch.leadsFact ?? ch.leads ?? 0;
                        const demosScheduledPlan = ch.demosScheduledPlan ?? 0;
                        const demosScheduledFact = ch.demosScheduledFact ?? 0;
                        const demosCompletedPlan = ch.demosCompletedPlan ?? 0;
                        const demosCompletedFact = ch.demosCompletedFact ?? 0;
                        const paymentsPlan = ch.paymentsPlan ?? 0;
                        const paymentsFact = ch.paymentsFact ?? 0;
                        const cpl = leadsFact > 0 ? Math.round(budgetFact / leadsFact) : 0;

                        // Дополнительные метрики (план/факт)
                        const impressionsPlan = ch.impressionsPlan ?? 0;
                        const impressionsFact = ch.impressionsFact ?? 0;
                        const clicksPlan = ch.clicksPlan ?? 0;
                        const clicksFact = ch.clicksFact ?? 0;

                        // CTR и CPC (сначала из таблицы, иначе рассчитываем)
                        const ctrFact = ch.ctrFact > 0 ? ch.ctrFact : (clicksFact > 0 && impressionsFact > 0 ? ((clicksFact / impressionsFact) * 100).toFixed(1) : 0);
                        const ctrPlan = ch.ctrPlan ?? 0;
                        const cpcFact = ch.cpcFact > 0 ? ch.cpcFact : (clicksFact > 0 && budgetFact > 0 ? Math.round(budgetFact / clicksFact) : 0);
                        const cpcPlan = ch.cpcPlan ?? 0;

                        // Конверсии - берём из таблицы если есть, иначе рассчитываем
                        const convLeadToDemoFact = ch.convLeadToDemoFact > 0 ? ch.convLeadToDemoFact : calcConversion(leadsFact, demosScheduledFact);
                        const convLeadToDemoPlan = ch.convLeadToDemoPlan ?? 0;
                        const convDemoScheduledToCompletedFact = ch.convDemoScheduledToCompletedFact > 0 ? ch.convDemoScheduledToCompletedFact : calcConversion(demosScheduledFact, demosCompletedFact);
                        const convDemoScheduledToCompletedPlan = ch.convDemoScheduledToCompletedPlan ?? 0;
                        const convDemoToPaymentFact = ch.convDemoToPaymentFact > 0 ? ch.convDemoToPaymentFact : calcConversion(demosCompletedFact, paymentsFact);
                        const convDemoToPaymentPlan = ch.convDemoToPaymentPlan ?? 0;

                        return `
                            <tr class="channel-row" data-channel-idx="${idx}" onclick="toggleChannelDetails(${idx})">
                                <td>
                                    <div class="channel-name">
                                        <span class="channel-expand-icon">▶</span>
                                        <span class="channel-icon">${ch.icon}</span>
                                        ${ch.name}
                                    </div>
                                </td>
                                <td>${progressBar(budgetFact, budgetPlan, true, true)}</td>
                                <td>${progressBar(leadsFact, leadsPlan, false, false)}</td>
                                <td>${progressBar(demosScheduledFact, demosScheduledPlan, false, false)}</td>
                                <td>${progressBar(demosCompletedFact, demosCompletedPlan, false, false)}</td>
                                <td>${progressBar(paymentsFact, paymentsPlan, false, false)}</td>
                                <td class="channel-value">${cpl > 0 ? formatCurrency(cpl) : '—'}</td>
                            </tr>
                            <tr class="channel-details-row" data-details-idx="${idx}">
                                <td colspan="7" class="channel-details-cell">
                                    <div class="channel-details-content">
                                        <div class="channel-details-grid">
                                            <div class="channel-detail-item">
                                                <span class="channel-detail-label">Показы / Звонки</span>
                                                ${impressionsPlan > 0 || impressionsFact > 0
                                                    ? progressBar(impressionsFact, impressionsPlan, false, false)
                                                    : '<span class="channel-detail-value">—</span>'}
                                            </div>
                                            <div class="channel-detail-item">
                                                <span class="channel-detail-label">Клики / Дозвоны</span>
                                                ${clicksPlan > 0 || clicksFact > 0
                                                    ? progressBar(clicksFact, clicksPlan, false, false)
                                                    : '<span class="channel-detail-value">—</span>'}
                                            </div>
                                            <div class="channel-detail-item">
                                                <span class="channel-detail-label">CTR, %</span>
                                                <span class="channel-detail-value">${ctrFact > 0 ? ctrFact + '%' : '—'}${ctrPlan > 0 ? ` <small style="color:var(--text-muted)">(план ${ctrPlan}%)</small>` : ''}</span>
                                            </div>
                                            <div class="channel-detail-item">
                                                <span class="channel-detail-label">CPC, ₽</span>
                                                <span class="channel-detail-value">${cpcFact > 0 ? formatCurrency(cpcFact) : '—'}${cpcPlan > 0 ? ` <small style="color:var(--text-muted)">(план ${formatCurrency(cpcPlan)})</small>` : ''}</span>
                                            </div>
                                        </div>
                                        <div class="channel-conversions-title">Конверсии по воронке</div>
                                        <div class="channel-details-grid">
                                            <div class="channel-detail-item">
                                                <span class="channel-detail-label">Лид → Демо назн.</span>
                                                ${conversionDisplay(convLeadToDemoFact)}
                                                ${convLeadToDemoPlan > 0 ? `<small style="color:var(--text-muted)">План: ${convLeadToDemoPlan}%</small>` : ''}
                                            </div>
                                            <div class="channel-detail-item">
                                                <span class="channel-detail-label">Демо назн. → Демо пров.</span>
                                                ${conversionDisplay(convDemoScheduledToCompletedFact)}
                                                ${convDemoScheduledToCompletedPlan > 0 ? `<small style="color:var(--text-muted)">План: ${convDemoScheduledToCompletedPlan}%</small>` : ''}
                                            </div>
                                            <div class="channel-detail-item">
                                                <span class="channel-detail-label">Демо пров. → Оплата</span>
                                                ${conversionDisplay(convDemoToPaymentFact)}
                                                ${convDemoToPaymentPlan > 0 ? `<small style="color:var(--text-muted)">План: ${convDemoToPaymentPlan}%</small>` : ''}
                                            </div>
                                        </div>
                                    </div>
                                </td>
                            </tr>
                        `;
                    }).join('')}
                </tbody>
            `;
        }

        // Функция переключения развернутого состояния канала
        function toggleChannelDetails(idx) {
            const row = document.querySelector(`.channel-row[data-channel-idx="${idx}"]`);
            const detailsRow = document.querySelector(`.channel-details-row[data-details-idx="${idx}"]`);

            if (row && detailsRow) {
                row.classList.toggle('expanded');
                detailsRow.classList.toggle('visible');
            }
        }

        function renderTrendChart() {
            const ctx = document.getElementById('trendChart').getContext('2d');
            const colors = getThemeColors();

            // Используем упорядоченный список периодов (от старого к новому)
            const orderedPeriods = ['2025-7', '2025-8', '2025-9', '2025-10', '2025-11', '2025-12', '2026-1', '2026-2', '2026-3', '2026-4'];
            const validPeriods = orderedPeriods.filter(p => dashboardData[p]);

            const revenueData = validPeriods.map(p => dashboardData[p]?.revenue?.fact || 0);
            const planData = validPeriods.map(p => dashboardData[p]?.revenue?.plan || 0);
            const labels = validPeriods.map(p => {
                const config = SHEETS_CONFIG[p];
                return config ? config.name.split(' ')[0] : p;
            });

            if (trendChart) trendChart.destroy();

            const gradient = ctx.createLinearGradient(0, 0, 0, 350);
            gradient.addColorStop(0, document.documentElement.getAttribute('data-theme') === 'dark' ? 'rgba(6, 182, 212, 0.3)' : 'rgba(8, 145, 178, 0.2)');
            gradient.addColorStop(1, document.documentElement.getAttribute('data-theme') === 'dark' ? 'rgba(6, 182, 212, 0)' : 'rgba(8, 145, 178, 0)');

            trendChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [
                        { label: 'Факт', data: revenueData, borderColor: colors.accentCyan, backgroundColor: gradient, fill: true, tension: 0.4, pointRadius: 6, pointHoverRadius: 10, pointBackgroundColor: colors.accentCyan, pointBorderColor: colors.chartPointBorder, pointBorderWidth: 3, borderWidth: 3 },
                        { label: 'План', data: planData, borderColor: colors.chartTextSecondary, borderDash: [8, 4], fill: false, tension: 0.4, pointRadius: 4, pointBackgroundColor: colors.chartTextSecondary, pointBorderColor: colors.chartPointBorder, pointBorderWidth: 2, borderWidth: 2 }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    interaction: { intersect: false, mode: 'index' },
                    plugins: {
                        legend: { position: 'top', align: 'end', labels: { color: colors.chartText, font: { family: 'Outfit', size: 12 }, usePointStyle: true, padding: 20 } },
                        tooltip: { backgroundColor: colors.chartTooltipBg, titleColor: colors.chartTooltipText, bodyColor: colors.chartTextSecondary, borderColor: colors.chartTooltipBorder, borderWidth: 1, cornerRadius: 8, padding: 12, callbacks: { label: ctx => `${ctx.dataset.label}: ${formatCurrency(ctx.raw)}` } }
                    },
                    scales: {
                        x: { ticks: { color: colors.chartText, font: { family: 'Outfit', size: 12 } }, grid: { display: false } },
                        y: { ticks: { color: colors.chartTextSecondary, font: { family: 'Space Mono', size: 11 }, callback: v => formatCurrency(v) }, grid: { color: colors.chartGrid, drawBorder: false } }
                    }
                }
            });
        }

        function getPreviousPeriod(current) {
            if (current === 'all') return null;
            const orderedPeriods = ['2026-4', '2026-3', '2026-2', '2026-1', '2025-12', '2025-11', '2025-10', '2025-9', '2025-8', '2025-7'];
            const currentIndex = orderedPeriods.indexOf(current);
            return currentIndex < orderedPeriods.length - 1 ? orderedPeriods[currentIndex + 1] : null;
        }

        function getPeriodLabel(periodKey) {
            if (periodKey === 'all') return 'За всё время';
            const config = SHEETS_CONFIG[periodKey];
            if (config) return config.name;
            // Fallback
            const [year, month] = periodKey.split('-');
            const months = ['', 'Янв', 'Фев', 'Мар', 'Апр', 'Май', 'Июн', 'Июл', 'Авг', 'Сен', 'Окт', 'Ноя', 'Дек'];
            return `${months[parseInt(month)]} ${year}`;
        }

        // ========================================
        // UPDATE DASHBOARD
        // ========================================
        function updateDashboard() {
            const data = dashboardData[currentPeriod];
            if (!data) {
                console.warn('Нет данных для периода:', currentPeriod);
                return;
            }
            renderHealthScore();
            renderKPICards();
            renderAlerts();
            renderFunnel();
            renderPlanFactChart();
            renderUnitEconomics();
            renderChannelsTable();
            renderTrendChart();
        }

        // ========================================
        // EVENT LISTENERS
        // ========================================
        document.getElementById('periodSelector').addEventListener('change', (e) => {
            loadPeriodData(e.target.value);
        });

        // ========================================
        // INIT
        // ========================================
        async function initDashboard() {
            // Initialize theme first
            document.documentElement.setAttribute('data-theme', getPreferredTheme());
            updateThemeToggle(getPreferredTheme());

            // Сначала загружаем свежие данные для текущего периода
            await loadPeriodData(currentPeriod);

            // Затем загружаем исторические данные для графика трендов
            await loadAllPeriodsForTrend();
        }

        // Start the dashboard
        initDashboard();
    </script>
</body>
</html>
